name: safe-dotenv-check
description: Validate one or more .env files against a .env.example-style manifest.

branding:
  icon: check-circle
  color: green

inputs:
  example:
    description: Path to the manifest file, usually .env.example.
    required: true
  env_files:
    description: Newline-separated target .env file paths to validate.
    required: true
  env_names:
    description: Optional newline-separated logical env names, once or once per env file.
    required: false
    default: ""
  allow_extra:
    description: Legacy alias for extra=ignore.
    required: false
    default: "false"
  extra:
    description: How to handle keys that exist only in target env files. Use fail, warn, or ignore.
    required: false
    default: "fail"
  show_descriptions:
    description: Set to true to include manifest desc/description text in reports.
    required: false
    default: "false"
  redact_values:
    description: Set to true to omit invalid raw values from JSON reports.
    required: false
    default: "true"
  summary:
    description: Set to true to write a markdown summary to the GitHub Actions step summary.
    required: false
    default: "true"
  json_output_path:
    description: Optional path where the JSON report should be copied.
    required: false
    default: ""

outputs:
  ok:
    description: Whether all target files passed validation.
    value: ${{ steps.validate.outputs.ok }}
  report_path:
    description: Path to the generated JSON report inside the runner workspace.
    value: ${{ steps.validate.outputs.report_path }}

runs:
  using: composite
  steps:
    - id: validate
      shell: bash
      run: |
        set -euo pipefail

        report_path="${RUNNER_TEMP}/safe-dotenv-check-report.json"
        args=(--example "${{ inputs.example }}")

        while IFS= read -r line; do
          if [ -n "$line" ]; then
            args+=(--env "$line")
          fi
        done < <(printf '%s\n' "${{ inputs.env_files }}")

        while IFS= read -r line; do
          if [ -n "$line" ]; then
            args+=(--env-name "$line")
          fi
        done < <(printf '%s\n' "${{ inputs.env_names }}")

        if [ "${{ inputs.allow_extra }}" = "true" ]; then
          args+=(--allow-extra)
        else
          args+=(--extra "${{ inputs.extra }}")
        fi

        if [ "${{ inputs.show_descriptions }}" = "true" ]; then
          args+=(--show-descriptions)
        fi

        if [ "${{ inputs.redact_values }}" = "true" ]; then
          args+=(--redact-values)
        fi

        set +e
        node "${GITHUB_ACTION_PATH}/bin/safe-dotenv-check.js" "${args[@]}" --format json >"${report_path}"
        status=$?
        set -e

        ok=false
        if [ "${status}" -eq 0 ]; then
          ok=true
        fi

        echo "ok=${ok}" >>"${GITHUB_OUTPUT}"
        echo "report_path=${report_path}" >>"${GITHUB_OUTPUT}"

        if [ -n "${{ inputs.json_output_path }}" ]; then
          mkdir -p "$(dirname "${{ inputs.json_output_path }}")"
          cp "${report_path}" "${{ inputs.json_output_path }}"
        fi

        if [ "${{ inputs.summary }}" = "true" ]; then
          REPORT_PATH="${report_path}" node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, "utf8"));
            const list = (values) => values.length ? values.map((value) => `- ${value}`).join("\n") : "-";
            const invalidList = (values) => values.length ? values.map((entry) => `- ${entry.key} (${entry.expected})`).join("\n") : "-";
            const describedKeys = (item) => [
              ...item.missing,
              ...item.empty,
              ...item.invalid.map((entry) => entry.key),
              ...(item.warnExtra || []),
              ...item.warnMissing,
              ...item.warnEmpty,
              ...item.warnInvalid.map((entry) => entry.key)
            ];
            const descriptions = (item) => {
              if (!item.descriptions) return "-";
              const values = [...new Set(describedKeys(item))]
                .filter((key) => item.descriptions[key])
                .map((key) => `${key}: ${item.descriptions[key]}`);
              return values.length ? values.map((value) => `- ${value}`).join("\n") : "-";
            };

            process.stdout.write("## safe-dotenv-check\n\n");
            process.stdout.write(`Manifest: \`${report.example}\`\n\n`);

            for (const item of report.files) {
              const hasWarnings = (item.warnExtra || []).length > 0 || item.warnMissing.length > 0 || item.warnEmpty.length > 0 || item.warnInvalid.length > 0;
              const status = item.ok ? (hasWarnings ? "WARN" : "PASS") : "FAIL";
              const envName = item.envName || "-";
              const warnings = [
                ...(item.warnExtra || []).map((key) => `extra: ${key}`),
                ...item.warnMissing.map((key) => `missing: ${key}`),
                ...item.warnEmpty.map((key) => `empty: ${key}`)
              ];
              process.stdout.write(`### ${status} \`${item.file}\`${envName !== "-" ? ` (${envName})` : ""}\n\n`);
              process.stdout.write(`Missing\n${list(item.missing)}\n\n`);
              process.stdout.write(`Empty\n${list(item.empty)}\n\n`);
              process.stdout.write(`Invalid\n${invalidList(item.invalid)}\n\n`);
              process.stdout.write(`Extra\n${list(item.extra)}\n\n`);
              process.stdout.write(`Warnings\n${list(warnings)}\n\n`);
              process.stdout.write(`Warn invalid\n${invalidList(item.warnInvalid)}\n\n`);
              if (item.actions && item.actions.length) {
                process.stdout.write(`Next\n${list(item.actions)}\n\n`);
              }
              process.stdout.write(`Notes\n${descriptions(item)}\n\n`);
            }
          ' >>"${GITHUB_STEP_SUMMARY}"
        fi

        exit "${status}"
